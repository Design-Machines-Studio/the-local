<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Local</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #220D46;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.25rem 2rem;
            min-height: 100%;
        }

        .logo {
            width: 160px;
            height: auto;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 0 1.5rem;
        }

        .eyebrow {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ed1d26;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: clamp(1.25rem, 3.5vw, 1.75rem);
            font-weight: 700;
            line-height: 1.2;
            color: #220D46;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        .divider {
            width: 2rem;
            height: 2px;
            background: #ed1d26;
            margin: 1.25rem 0;
        }

        p {
            font-size: 14px;
            line-height: 1.65;
            color: #5a4a7a;
            max-width: 34ch;
        }

        .access {
            margin-top: 1.25rem;
            font-size: 11px;
            font-weight: 700;
            color: #8a8299;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .signin {
            display: inline-block;
            margin-top: 2rem;
            font-size: 14px;
            font-weight: 700;
            color: #F9F5F0;
            background: #220D46;
            padding: 0.7rem 1.5rem;
            text-decoration: none;
            border-radius: 3px;
            letter-spacing: 0.01em;
        }

        .signin:hover {
            background: #2d1060;
        }

        .footer {
            font-size: 11px;
            color: #c0bac8;
        }

        .footer a {
            color: #c0bac8;
            text-decoration: none;
        }

        .footer a:hover {
            color: #8a8299;
        }

        /* Override Element's default lake.jpg background */
        .mx_AuthPage {
            background: #220D46 !important;
        }

        /* Replace blurred lake.jpg with clean white card */
        .mx_AuthPage_modalBlur {
            background: rgba(249, 245, 240, 0.96) !important;
            filter: none !important;
        }

        /* Hide the Element/Matrix footer links */
        .mx_AuthPage .mx_AuthFooter {
            display: none !important;
        }
    </style>
</head>
<body>
    <img src="/assets/the-local-logo.png" alt="The Local" class="logo" />

    <div class="main">
        <div class="eyebrow">Matrix &middot; Federated &middot; Self-hosted</div>
        <h1>Communications for the workplace democracy movement.</h1>
        <div class="divider"></div>
        <p>The Local connects co-operatives, organizers, and movement builders on a private network built on open standards.</p>
        <p class="access">Membership by invitation</p>
        <a href="/#/login" target="_top" class="signin">Sign in</a>
    </div>

    <div class="footer">
        <a href="https://designmachines.studio">Design Machines</a>
    </div>

</body>
</html>
