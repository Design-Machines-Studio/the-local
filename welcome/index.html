<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Local</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            background: #220D46;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #F9F5F0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.5rem 2.25rem;
            min-height: 100vh;
        }

        .logo {
            width: 180px;
            height: auto;
            /* Invert the logo to show light on dark background */
            filter: brightness(0) invert(1);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 0 2rem;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ed1d26;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            line-height: 1.2;
            color: #F9F5F0;
            margin-bottom: 1.25rem;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 15px;
            line-height: 1.65;
            color: rgba(249, 245, 240, 0.7);
            max-width: 36ch;
        }

        .divider {
            width: 2rem;
            height: 2px;
            background: #ed1d26;
            margin: 2rem 0;
        }

        .access {
            font-size: 13px;
            font-weight: 600;
            color: rgba(249, 245, 240, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .footer {
            font-size: 12px;
            color: rgba(249, 245, 240, 0.3);
        }

        .footer a {
            color: rgba(249, 245, 240, 0.4);
            text-decoration: none;
        }

        .footer a:hover {
            color: rgba(249, 245, 240, 0.7);
        }
    </style>
</head>
<body>
    <img src="/assets/the-local-logo.png" alt="The Local" class="logo" />

    <div class="main">
        <div class="eyebrow">Matrix · Federated · Self-hosted</div>
        <h1>Communications for the workplace democracy movement.</h1>
        <div class="divider"></div>
        <p>The Local connects co-operatives, organizers, and movement builders on a private network built on open standards.</p>
        <br>
        <p class="access">Membership by invitation</p>
    </div>

    <div class="footer">
        <a href="https://designmachines.studio">Design Machines</a>
    </div>
</body>
</html>
