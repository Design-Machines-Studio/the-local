<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Local</title>
    <style>
        /*
         * NOTE: This file is injected inline into Element Web (not an iframe).
         * All CSS here applies globally to thelocal.chat. Never use bare
         * selectors (body, h1, *, etc.) -- scope everything to .tlw.
         */

        .tlw {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2.25rem 2rem;
            height: 100%;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #220D46;
        }

        .tlw .logo {
            width: 148px;
            height: auto;
            display: block;
        }

        .tlw .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 0 1.5rem;
        }

        .tlw .eyebrow {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #ed1d26;
            margin-bottom: 1rem;
        }

        .tlw .heading {
            font-size: clamp(1.25rem, 3.5vw, 1.75rem);
            font-weight: 700;
            line-height: 1.2;
            color: #220D46;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        .tlw .divider {
            width: 2rem;
            height: 2px;
            background: #ed1d26;
            margin: 1.25rem 0;
        }

        .tlw .desc {
            font-size: 14px;
            line-height: 1.65;
            color: #5a4a7a;
            max-width: 34ch;
        }

        .tlw .access {
            margin-top: 1.25rem;
            font-size: 11px;
            font-weight: 700;
            color: #8a8299;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .tlw .button-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .tlw .btn-primary,
        .tlw .btn-primary:visited,
        .tlw .btn-primary:focus {
            flex: 1;
            display: block;
            padding: 0.85rem 1.25rem;
            font-size: 14px;
            font-weight: 700;
            color: #F9F5F0 !important;
            background: #220D46;
            border-radius: 8px;
            text-decoration: none !important;
            text-align: center;
            letter-spacing: 0.01em;
            box-sizing: border-box;
        }

        .tlw .btn-primary:hover {
            background: #2d1060;
            color: #F9F5F0 !important;
        }

        .tlw .btn-outline,
        .tlw .btn-outline:visited,
        .tlw .btn-outline:focus {
            flex: 1;
            display: block;
            padding: calc(0.85rem - 2px) 1.25rem;
            font-size: 14px;
            font-weight: 700;
            color: #220D46 !important;
            background: transparent;
            border: 2px solid #220D46;
            border-radius: 8px;
            text-decoration: none !important;
            text-align: center;
            letter-spacing: 0.01em;
            box-sizing: border-box;
        }

        .tlw .btn-outline:hover {
            background: rgba(34, 13, 70, 0.06);
            color: #220D46 !important;
        }

        .tlw .footer {
            font-size: 11px;
            color: #c0bac8;
        }

        .tlw .footer a,
        .tlw .footer a:visited {
            color: #c0bac8 !important;
            text-decoration: none !important;
        }

        .tlw .footer a:hover {
            color: #8a8299 !important;
        }
    </style>
</head>
<body>
    <div class="tlw">
        <img src="/assets/the-local-logo.png" alt="The Local" class="logo" />

        <div class="main">
            <div class="eyebrow">Federated &middot; Self-hosted &middot; Encrypted</div>
            <div class="heading">Communications for the workplace democracy movement.</div>
            <div class="divider"></div>
            <p class="desc">The Local connects co-operatives, organizers, and movement builders on a private network built on open standards.</p>
            <p class="access">Membership by invitation</p>
            <div class="button-row">
                <a href="/#/login" target="_top" class="btn-primary">Sign in</a>
                <a href="/#/register" target="_top" class="btn-outline">Create account</a>
            </div>
        </div>

        <div class="footer">
            <a href="https://designmachines.studio">Design Machines</a>
        </div>
    </div>
</body>
</html>
