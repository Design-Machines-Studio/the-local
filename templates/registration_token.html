{% extends "_base.html" %}
{% block title %}Registration token — The Local{% endblock %}

{% block body %}
{% if error is defined %}
<p class="error"><strong>{{ error }}</strong></p>
{% endif %}
<h1>Enter your registration token</h1>
<p>You'll need a token to create an account on The Local.</p>
<form method="post" action="{{ myurl }}" style="margin: 0 0 1.25rem 0;">
    <input type="hidden" name="session" value="{{ session }}" />
    <label for="token" style="display: block; font-size: 15px; font-weight: 600; color: #220D46; margin-bottom: 0.4rem;">Registration token</label>
    <input type="text" id="token" name="token" class="input" autocomplete="one-time-code" />
    <button type="submit" class="btn">Continue</button>
</form>
{% endblock %}
