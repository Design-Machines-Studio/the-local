# ═══════════════════════════════════════════════════════════
# The Local — matrix-hookshot config
# DM-019/WORKS · thelocal.chat
#
# TEMPLATE — setup.sh generates hookshot/config.yml.active
# Edit this file, then re-run setup.sh to regenerate.
#
# Hookshot is a Matrix application service, not a plain webhook
# receiver. It also needs hookshot/registration.yml mounted into
# Synapse — see app_service_config_files in homeserver.yaml.
# ═══════════════════════════════════════════════════════════

# ─── Homeserver connection ───────────────────────────────
bridge:
  domain: thelocal.chat
  url: http://synapse:8008
  mediaUrl: https://matrix.thelocal.chat
  port: 9993
  bindAddress: 0.0.0.0

# ─── Logging ─────────────────────────────────────────────
logging:
  level: info
  colorize: false
  json: false

# ─── Token encryption key ────────────────────────────────
# Encrypts per-user OAuth tokens at rest. Generated by setup.sh.
passFile: /data/passkey.pem

# ─── Listeners ───────────────────────────────────────────
# 9000 — public, proxied by Caddy (webhooks + OAuth callback)
# 9001 — loopback only, not reachable from Caddy
listeners:
  - port: 9000
    bindAddress: 0.0.0.0
    resources:
      - webhooks
  - port: 9001
    bindAddress: 127.0.0.1
    resources:
      - metrics

# ─── GitHub ──────────────────────────────────────────────
# Requires a GitHub App. See README for creation steps.
# Webhook URL:  https://matrix.thelocal.chat/github/webhook
# Callback URL: https://matrix.thelocal.chat/oauth
#               (must match oauth.redirect_uri exactly)
github:
  auth:
    id: "%%GITHUB_APP_ID%%"
    privateKeyFile: /data/github-key.pem
  webhook:
    secret: "%%GITHUB_WEBHOOK_SECRET%%"
  oauth:
    client_id: "%%GITHUB_OAUTH_CLIENT_ID%%"
    client_secret: "%%GITHUB_OAUTH_CLIENT_SECRET%%"
    redirect_uri: "https://matrix.thelocal.chat/oauth"
  defaultOptions:
    showIssueRoomLink: false

# ─── Generic webhooks ────────────────────────────────────
# Catch-all inbound endpoint. Assembly's Go governance bridges
# target this instead of hand-rolling Matrix API calls.
# allowJsTransformationFunctions stays false — it executes
# user-supplied JS in the bridge process.
generic:
  enabled: true
  outbound: false
  urlPrefix: "https://matrix.thelocal.chat/webhook/"
  userIdPrefix: _webhooks_
  allowJsTransformationFunctions: false
  waitForComplete: false

# ─── RSS/Atom feeds ──────────────────────────────────────
feeds:
  enabled: true
  pollIntervalSeconds: 600
  pollTimeoutSeconds: 30

# ─── Figma ───────────────────────────────────────────────
# Figma webhooks require a PAID Figma team plan. On a Starter
# team, hookshot fails to register the webhook at startup.
# Uncomment once the plan is confirmed, then re-run setup.sh
# and add /figma/* to the Caddyfile.
# figma:
#   publicUrl: "https://matrix.thelocal.chat/figma/webhook"
#   instances:
#     designmachines:
#       teamId: "%%FIGMA_TEAM_ID%%"
#       accessToken: "%%FIGMA_ACCESS_TOKEN%%"
#       passcode: "%%FIGMA_PASSCODE%%"

# ─── Permissions ─────────────────────────────────────────
# Levels are additive:
#   commands → login → notifications → manageConnections → admin
# Homeserver-wide `commands` suits Circle 1 (5-10 trusted people).
# Revisit before Circle 3, when federation opens.
permissions:
  - actor: thelocal.chat
    services:
      - service: "*"
        level: commands
  - actor: "@trav:thelocal.chat"
    services:
      - service: "*"
        level: admin
